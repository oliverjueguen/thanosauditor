[project]
name = "thanos"
version = "1.0.0"
description = "Thanos: patch triage pipeline for Windows Server 2022 (Patch Tuesday). Evolution of Practice 1 into an installable product."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Oliver Jueguen Vazquez" },
    { name = "Oana Maria Arsinte" },
    { name = "Manuel Cordero Romero" },
    { name = "Antonio Vergara" },
]

# Lower bounds chosen to exclude versions with known vulnerabilities
# (pip-audit); the exact tested versions are in constraints.txt.
dependencies = [
    # Ontology (replaces Neo4j): lightweight, versionable RDF/OWL graph
    "rdflib>=7.1,<8.0",
    # Web dashboard
    "fastapi>=0.120,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.31",
    # Configuration (.env) and utilities
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Thanos Auditor: Claude via the Agent SDK, using the user's own Claude session.
auditor = [
    "claude-agent-sdk>=0.2.165,<0.3",
]
# Development and tests. Starlette's TestClient uses httpx2 (Starlette >= 1.x,
# Python >= 3.11) or httpx (older Starlette, Python 3.10): both are declared.
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
    "httpx2>=2.0",
    "pip-audit>=2.7",
    "ruff>=0.5",
]

[project.scripts]
thanos-ontology = "thanos.ontology.cli:main"
thanos-auditor = "thanos.auditor.cli:main"
thanos-panel = "thanos.panel.app:main"
thanos-coordinator = "thanos.coordinator.__main__:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thanos*"]

[tool.setuptools.package-data]
thanos = ["ontology/*.ttl", "executor/ghidra_scripts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["output", "staging", "data", "downloads"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# HTML templates and test data: long lines are more readable unwrapped.
"thanos/panel/render.py" = ["E501"]
"tests/*" = ["E501"]
# run_diff.py adjusts sys.path before importing thanos (it runs from the ZIP).
"executor/run_diff.py" = ["E402"]
